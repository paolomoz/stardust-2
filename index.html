<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redirecting…</title>
<link rel="canonical" href="https://paolomoz.github.io/stardust-2/samples/">
<script>
  // Preserve querystring + fragment when redirecting.
  (function(){
    var target = 'samples/' + window.location.search + window.location.hash;
    window.location.replace(target);
  })();
</script>
<meta http-equiv="refresh" content="0; url=samples/">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#f6f6f7;color:#15171d;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}
  .card{max-width:480px;background:#fff;border:1px solid rgba(20,22,30,.08);border-radius:16px;padding:32px}
  p{margin:0 0 12px;line-height:1.6}
  .meta{font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;color:#5b5e6a;letter-spacing:.04em;text-transform:uppercase;margin-bottom:16px}
  a{color:#3a4cf5;font-weight:700;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
<p class="meta">Redirect</p>
<p>The showcase lives at <a href="samples/">samples/</a>.</p>
<p style="font-size:13px;color:#5b5e6a">Redirecting now. Use the link above if it doesn't auto-redirect.</p>
</div>
</body>
</html>
